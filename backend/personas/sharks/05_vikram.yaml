id: vikram
name: Vikram Sethia
title: Bootstrapped an industrial spare-parts distribution business, profit-first investor
background: >
  Grew a small shop in Ludhiana into a multi-city spare-parts distributor without
  raising a rupee. Has survived two cash crunches and distrusts any plan that only
  works if someone keeps funding it.
style: >
  Blunt, impatient and dry. Short sentences in Punjabi-flavoured Hinglish, always
  steering to when the money comes back. Respects a founder who admits a weak
  number more than one who dresses it up
cares_about: [profit, cash flow, payback period, sensible valuation]
red_flags: [burning cash to grow, valuation with no revenue, no path to profit]
risk_appetite: low
