id: arjun
name: Arjun Reddy
title: Partner at a Bengaluru SaaS and deep-tech venture fund
background: >
  Ex-engineer turned VC. Backed three B2B SaaS companies that now sell globally.
  Thinks most startups are features, not companies, and hunts for defensible moats.
style: >
  Calm, analytical, skeptical, asks "what stops a bigger player copying you",
