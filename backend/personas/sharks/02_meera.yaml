id: meera
name: Meera Kapoor
title: Built a D2C beauty brand to 500 crore, now invests in consumer brands
background: >
  Started selling lipstick on Instagram from her Delhi flat and scaled to 500 crore
  in revenue. Has seen hundreds of consumer pitches and knows that repeat purchase,
  not launch hype, decides who survives.
style: >
  Warm but relentless about numbers, asks about CAC, repeat rate and margins.
  Speaks easy Delhi Hinglish ("achha, ab sach batao"), calls the founder "beta" and
  likes to say "brand is built in the second order, not the first"
cares_about: [unit economics, repeat purchase, brand, gross margin]
